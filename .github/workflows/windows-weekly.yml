#
# Weekly canary: does the Windows patch series still build against today's
# upstream OPM, and does what it builds still run?
#
# It builds the configuration the package ships - hybrid MPI+OpenMP - and runs
# Norne on 4 ranks, rather than a serial build on a ten-cell tutorial. That
# costs build time (MS-MPI, Zoltan from Trilinos) and buys coverage of the
# parallel path: partitioning, the linear solver across ranks, and the rank-0
# output gather, none of which a serial smoke test can break on.
#
# The series lives on the 'windows' branch of the GitPaean forks and is rebased
# onto upstream master as it moves. Left alone, the cost of that rebase grows
# with the gap: a week of upstream is usually one small conflict, three months
# is a pile of them plus a build failure with a dozen candidate causes. So this
# rebases first and builds the result - the point is to hear about a break in
# the week it happens, not at the next release.
#
# A conflict and a build failure are reported as different outcomes on purpose:
# a conflict needs a human judgement about the code, a build failure usually
# names the upstream commit that caused it.
#
# Deliberately NOT triggered by pull_request. If this is ever moved to a
# self-hosted runner, a fork PR would otherwise run arbitrary code on that
# machine - these repositories are public.

name: windows-weekly

on:
  schedule:
    # Friday, end of the working day: a break is heard about while the week is
    # still open, and nothing lands on Monday morning. Cron is always UTC and
    # does not follow DST, so a fixed time drifts an hour across the year:
    # 15:17 UTC is 17:17 in Norway on summer time and 16:17 on winter time -
    # late afternoon either way. The odd minute is deliberate; runs scheduled
    # on the hour queue behind everyone else's.
    # For Saturday early morning instead, use '17 3 * * 6' (05:17 / 04:17 local).
    - cron: '17 15 * * 5'
  workflow_dispatch:
    inputs:
      sim_target:
        description: 'opm-simulators target to build'
        type: choice
        options: [flow_blackoil, flow]
        default: flow_blackoil
      rebase:
        description: 'Rebase onto upstream master before building'
        type: boolean
        default: true

permissions:
  contents: read
  # ... and to file the failure report below. A scheduled run that only fails
  # by e-mail is a run nobody hears about: GitHub mails the account that last
  # touched the cron, if that account has Actions notifications on, and leaves
  # nothing behind in the repository either way.
  issues: write

concurrency:
  group: windows-weekly
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    # Below the 6 h hosted-runner ceiling, so an overrun is reported as a
    # timeout here rather than as an opaque cancellation.
    timeout-minutes: 330
    defaults:
      run:
        shell: pwsh

    env:
      FORK_ORG: GitPaean
      FORK_BRANCH: windows
      # vcpkg builds the dependencies once and restores them from the Actions
      # cache on later runs; without this every run pays for Boost from source.
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

    steps:
      - name: Check out the build harness
        uses: actions/checkout@v4

      - name: Export Actions cache endpoints for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # The released package is a hybrid MPI+OpenMP build, so the canary builds
      # and exercises one - a serial build would leave the configuration that
      # actually ships untested. That needs the MS-MPI runtime (mpiexec,
      # msmpi.dll) and its SDK (mpi.h, msmpi.lib).
      #
      # build-all.ps1 would reach for winget; these are fetched straight from
      # Microsoft instead, which does not depend on a package source being
      # reachable from a runner and is the same runtime the package ships in
      # redist\. Ensure-MsMpi then finds MSMPI_INC already set and does nothing.
      - name: Install MS-MPI (runtime + SDK)
        run: |
          $base = 'https://download.microsoft.com/download/7/2/7/72731ebb-b63c-4170-ade7-836966263a8f'
          foreach ($f in 'msmpisetup.exe', 'msmpisdk.msi') {
            Invoke-WebRequest -Uri "$base/$f" -OutFile $f -UseBasicParsing
          }
          # -unattend is MS-MPI's own silent switch; the SDK is a plain MSI.
          Start-Process -Wait -FilePath .\msmpisetup.exe -ArgumentList '-unattend'
          Start-Process -Wait -FilePath msiexec.exe `
            -ArgumentList '/i', 'msmpisdk.msi', '/quiet', '/norestart'

          # Both installers set MSMPI_* machine-wide, but this job's environment
          # was captured before that, so hand them to the later steps by hand.
          foreach ($v in 'MSMPI_INC', 'MSMPI_LIB64', 'MSMPI_BIN') {
            $val = [Environment]::GetEnvironmentVariable($v, 'Machine')
            if ($val) { "$v=$val" | Out-File -Append $env:GITHUB_ENV }
          }
          $bin = [Environment]::GetEnvironmentVariable('MSMPI_BIN', 'Machine')
          if ($bin) { $bin | Out-File -Append $env:GITHUB_PATH }

          # Fail here rather than 40 minutes into a build that cannot find MPI.
          if (-not [Environment]::GetEnvironmentVariable('MSMPI_INC', 'Machine')) {
            throw 'MS-MPI SDK did not register MSMPI_INC; the MPI build would not find MPI.'
          }
          Write-Host "MSMPI_INC=$env:MSMPI_INC"
          if (-not (Test-Path (Join-Path $bin 'mpiexec.exe'))) {
            throw "mpiexec.exe not found under $bin"
          }

      # Disk is the constraint most likely to sink this on a hosted runner: the
      # working trees measured ~35 GB on a developer machine, of which vcpkg is
      # the bulk. Report it up front so a first manual run answers that question
      # even if a later step fails.
      - name: Free disk before
        run: |
          # Every fixed drive, not a hardcoded C:. The workspace is on D: on a
          # hosted runner, so measuring C: reports a volume the build never
          # touches - which looks reassuring and says nothing.
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name,
              @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}},
              @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} |
            Format-Table -AutoSize | Out-String | Write-Host
          Write-Host "workspace: $env:GITHUB_WORKSPACE"

      - name: Fetch the forks and rebase onto upstream
        id: rebase
        run: |
          $ErrorActionPreference = 'Continue'
          git config --global user.email 'windows-weekly@users.noreply.github.com'
          git config --global user.name  'windows-weekly'
          # An input is empty on a scheduled run, so default to rebasing.
          $doRebase = '${{ inputs.rebase }}' -ne 'false'
          New-Item -ItemType Directory -Force -Path src | Out-Null

          $conflicted = @()
          $summary = @()
          foreach ($m in 'opm-common', 'opm-grid', 'opm-simulators') {
            Write-Host "::group::$m"
            git clone --quiet -c core.autocrlf=false `
              --branch $env:FORK_BRANCH "https://github.com/$env:FORK_ORG/$m.git" "src/$m"
            if ($LASTEXITCODE -ne 0) { throw "could not clone $m" }
            git -C "src/$m" remote add upstream "https://github.com/OPM/$m.git"
            git -C "src/$m" fetch --quiet upstream master
            if ($LASTEXITCODE -ne 0) { throw "could not fetch upstream/$m" }

            $behind = (git -C "src/$m" rev-list --count 'HEAD..upstream/master').Trim()
            $ahead  = (git -C "src/$m" rev-list --count 'upstream/master..HEAD').Trim()
            Write-Host "$m : $ahead patch commit(s), $behind upstream commit(s) not yet in $env:FORK_BRANCH"

            if ($doRebase -and $behind -ne '0') {
              git -C "src/$m" rebase upstream/master
              if ($LASTEXITCODE -ne 0) {
                # Leave nothing half-rebased behind; the report is the output.
                git -C "src/$m" rebase --abort
                $conflicted += $m
                $summary += "| $m | $ahead | $behind | **conflict** |"
                Write-Host "::warning title=Rebase conflict::$m does not rebase cleanly onto upstream/master"
              } else {
                $summary += "| $m | $ahead | $behind | rebased |"
              }
            } else {
              $summary += "| $m | $ahead | $behind | up to date |"
            }
            Write-Host '::endgroup::'
          }

          "## Rebase onto upstream master`n"                      | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "| module | patch commits | upstream commits behind | result |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "|---|---|---|---|"                                     | Out-File -Append $env:GITHUB_STEP_SUMMARY
          $summary | Out-File -Append $env:GITHUB_STEP_SUMMARY

          if ($conflicted.Count -gt 0) {
            $names = $conflicted -join ', '
            "`n**Conflicts in: $names** - these need a human, not a rerun." |
              Out-File -Append $env:GITHUB_STEP_SUMMARY
            Write-Host "::error title=Rebase conflict::$names conflict with upstream/master. Resolve locally; the build was not attempted."
            exit 1
          }

      # build-all.ps1 clones vcpkg and DUNE and applies the DUNE MSVC patches.
      # It skips any OPM module that is already present, so the rebased trees
      # above are kept. Do NOT pass -SkipClone: that also skips Apply-DunePatch,
      # and the DUNE build then fails on Windows.
      - name: Build
        id: build
        run: |
          $target = '${{ inputs.sim_target }}'
          if (-not $target) { $target = 'flow_blackoil' }
          Write-Host "building target: $target (MPI)"
          # -Mpi: DUNE and the OPM modules built against MS-MPI, plus Zoltan
          # from a Trilinos clone, into build-mpi\ / install-mpi\.
          .\build-all.ps1 -Mpi -SimTarget $target -Jobs 4
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      # Norne rather than SPE1: a real field case with faults, multi-segment
      # wells and a decade of schedule exercises far more of the simulator than
      # a ten-cell tutorial, and on 4 ranks it also covers the parallel path -
      # partitioning, the linear solver across ranks, and the rank-0 output
      # gather - which is what the package ships and what SPE1 never touched.
      - name: Fetch the Norne deck
        run: |
          # opm-tests is ~4.4 GB; the deck and its INCLUDE tree are a few MB of
          # it and the rest of norne\ is reference solutions this does not read.
          # Hence blobless + a non-cone sparse set, not a clone.
          git clone --filter=blob:none --no-checkout --depth 1 `
            https://github.com/OPM/opm-tests.git opm-tests
          if ($LASTEXITCODE -ne 0) { throw 'could not clone opm-tests' }
          git -C opm-tests sparse-checkout init --no-cone
          git -C opm-tests sparse-checkout set '/norne/NORNE_ATW2013.DATA' '/norne/INCLUDE/**'
          git -C opm-tests checkout
          if (-not (Test-Path 'opm-tests\norne\NORNE_ATW2013.DATA')) {
            throw 'Norne deck was not checked out'
          }
          $inc = @(Get-ChildItem 'opm-tests\norne\INCLUDE' -Recurse -File).Count
          Write-Host "deck plus $inc INCLUDE files"

      - name: Run Norne on 4 MPI ranks
        run: |
          $target = '${{ inputs.sim_target }}'
          if (-not $target) { $target = 'flow_blackoil' }
          $exe = ".\build-mpi\opm-simulators\bin\$target.exe"
          if (-not (Test-Path $exe)) { throw "no simulator at $exe" }

          # Pre-authorize the exe in the firewall. Unattended there is nobody to
          # answer a popup, and a cancelled one leaves a Block rule that makes
          # mpiexec hang rather than fail - a 5.5 h timeout instead of an error.
          .\allow-firewall.ps1

          # setup-env.ps1 imports MSMPI_* from the machine registry and puts
          # mpiexec on PATH for this shell.
          . .\setup-env.ps1

          # 4 ranks, one thread each: the hosted runner has 4 vCPUs, so more of
          # either only oversubscribes and makes the run slower and noisier.
          $deck = '.\opm-tests\norne\NORNE_ATW2013.DATA'
          mpiexec -n 4 $exe $deck --output-dir=norne_out --threads-per-process=1
          if ($LASTEXITCODE -ne 0) { throw "Norne run failed ($LASTEXITCODE)" }

          # A run that exits 0 having written nothing would still be a failure,
          # so check the output exists - and check for what flow actually
          # writes: the summary payload is .ESMRY or .UNSMRY depending on the
          # deck, and .SMSPEC accompanies either form.
          $spec = Test-Path 'norne_out\NORNE_ATW2013.SMSPEC'
          $data = (Test-Path 'norne_out\NORNE_ATW2013.ESMRY') -or
                  (Test-Path 'norne_out\NORNE_ATW2013.UNSMRY')
          if (-not ($spec -and $data)) {
              Write-Host 'output directory contained:'
              Get-ChildItem norne_out | Select-Object -ExpandProperty Name | Write-Host
              throw 'Norne wrote no summary output'
          }
          # The PRT reports the rank count it actually ran on: a parallel build
          # launched wrongly would run 4 independent serial copies over each
          # other's output and still look like a pass here.
          $prt = Get-Content 'norne_out\NORNE_ATW2013.PRT' -Raw -ErrorAction SilentlyContinue
          $ranks = if ($prt -match 'Number of MPI processes:\s*(\d+)') { $matches[1] } else { '?' }
          if ($ranks -ne '4') {
              throw "expected 4 MPI processes, the run reported: $ranks"
          }
          "`n## Smoke test`nNorne ran to completion on $ranks MPI ranks and wrote its summary output." |
            Out-File -Append $env:GITHUB_STEP_SUMMARY

      - name: Free disk after
        if: always()
        run: |
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name,
              @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}},
              @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} |
            Format-Table -AutoSize | Out-String | Write-Host

      - name: Upload the binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flow-windows-x64
          retention-days: 14
          path: |
            build-mpi/opm-simulators/bin/*.exe
            build-mpi/opm-simulators/bin/*.dll

      # Say so somewhere that survives a missed e-mail. One issue is kept open
      # and commented on rather than a fresh one filed every Friday: the point
      # is to notice a break, and a pile of identical issues is how a canary
      # stops being read. It closes itself when a run passes again, so an open
      # issue means "still broken" without anyone having to tend it.
      - name: Report a failure as an issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'windows-weekly: the Windows patch series stopped building';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                        `/actions/runs/${context.runId}`;
            const body = [
              `The weekly canary failed: [run ${context.runId}](${url}).`,
              '',
              'The step summary on that run says which module conflicted or what',
              'the build said. A **conflict** needs the patch series rebased by',
              'hand; a **build failure** usually names the upstream commit.',
              '',
              `_Triggered by \`${context.eventName}\` on \`${context.sha.slice(0, 9)}\`._`
            ].join('\n');
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'windows-weekly', per_page: 10
            });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open.data[0].number, body
              });
              core.notice(`Commented on the open report, issue #${open.data[0].number}`);
            } else {
              const made = await github.rest.issues.create({
                ...context.repo, title, body, labels: ['windows-weekly']
              });
              core.notice(`Opened issue #${made.data.number}`);
            }

      - name: Close the failure report once it builds again
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'windows-weekly', per_page: 10
            });
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                        `/actions/runs/${context.runId}`;
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: `Building again as of [run ${context.runId}](${url}) - closing.`
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: issue.number, state: 'closed'
              });
              core.notice(`Closed issue #${issue.number}`);
            }
