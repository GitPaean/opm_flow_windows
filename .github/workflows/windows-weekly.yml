#
# Nightly, two questions side by side: does the build a user gets from this
# harness still build and run ('pinned'), and does the Windows patch series
# still build against today's upstream OPM ('latest', the canary)?
#
# It builds the configurations the packages ship - hybrid MPI+OpenMP against
# MS-MPI, and the same against Intel MPI for the no-administrator package - and
# runs Norne with MS-MPI at 4 ranks x 1 thread and Intel MPI at 2 ranks x 2
# threads. That costs build time (two chains, Zoltan from Trilinos twice) and
# buys coverage of the parallel path: partitioning, the linear solver across
# ranks, and the rank-0 output gather, none of which a serial smoke test can
# break on - and it answers the question for both released packages rather than
# leaving the second one to be discovered broken by whoever downloads it.
#
# The series lives on the 'windows' branch of the GitPaean forks and is rebased
# onto upstream master as it moves. Left alone, the cost of that rebase grows
# with the gap: a week of upstream is usually one small conflict, three months
# is a pile of them plus a build failure with a dozen candidate causes. So this
# rebases first and builds the result - the point is to hear about a break the
# day it happens, not at the next release.
#
# A conflict and a build failure are reported as different outcomes on purpose:
# a conflict needs a human judgement about the code, a build failure usually
# names the upstream commit that caused it.
#
# That is the 'latest' job, and it takes vcpkg (master) and Trilinos (develop)
# at their newest as well, so a dependency update that breaks the build shows
# up there first. Beside it runs 'pinned': the build a user gets. build-all.ps1
# builds the OPM commits, the vcpkg commit and the Trilinos commit the harness
# pins (opm-sources.json), so that job clones nothing itself - it runs
# build-all.ps1 as a user would and lets it check out the pins. The pins only
# move after a build of the new set - the canary pins the branch heads when it
# built them as they are - so what breaks that job is everything else: the
# runner image and its compiler (MSVC 19.51 already miscompiled OPM once), the
# Intel MPI wheels, a download a pinned port can no longer get - or a pin
# update that was only checked with an older compiler, or by the canary against
# newer vcpkg and Trilinos than the pinned ones. Each job files its own
# failure report: a broken canary means the series or a dependency update
# needs work, a broken pinned build means users are affected now.
#
# Deliberately NOT triggered by pull_request. If this is ever moved to a
# self-hosted runner, a fork PR would otherwise run arbitrary code on that
# machine - these repositories are public.

name: windows-weekly

on:
  schedule:
    # Every night: a break then comes from one day of upstream changes, and the
    # result is waiting at the start of the working day. Cron is always UTC and
    # does not follow DST: 00:17 UTC is 02:17 in Norway on summer time and 01:17
    # on winter time. The odd minute is deliberate; runs scheduled on the hour
    # queue behind everyone else's.
    # For every other day instead, use '17 0 */2 * *' (odd days of the month).
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      sim_target:
        description: 'opm-simulators target to build'
        type: choice
        options: [flow_blackoil, flow]
        default: flow_blackoil
      rebase:
        description: 'latest: rebase onto upstream master before building'
        type: boolean
        default: true
      sources:
        description: 'Which jobs: the pinned commits (as build-all.ps1 builds them), the rebased branch heads, or both'
        type: choice
        options: [both, pinned, latest]
        default: both

permissions:
  # Write, so the canary can commit the pins when it has verified the branch
  # heads (see "Pin the branch heads it built").
  contents: write
  # ... and to file the failure report below. A scheduled run that only fails
  # by e-mail is a run nobody hears about: GitHub mails the account that last
  # touched the cron, if that account has Actions notifications on, and leaves
  # nothing behind in the repository either way.
  issues: write

concurrency:
  group: windows-weekly
  cancel-in-progress: false

jobs:
  build:
    # A scheduled run has no inputs, so it runs both.
    strategy:
      fail-fast: false
      matrix:
        sources: ${{ fromJSON(inputs.sources == 'pinned' && '["pinned"]' || inputs.sources == 'latest' && '["latest"]' || '["pinned", "latest"]') }}
    name: build (${{ matrix.sources }})
    runs-on: windows-latest
    # Below the 6 h hosted-runner ceiling, so an overrun is reported as a
    # timeout here rather than as an opaque cancellation.
    timeout-minutes: 330
    defaults:
      run:
        shell: pwsh

    env:
      FORK_ORG: GitPaean
      FORK_BRANCH: windows
      # vcpkg builds the dependencies once and restores them from the Actions
      # cache on later runs; without this every run pays for Boost from source.
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

    steps:
      - name: Check out the build harness
        uses: actions/checkout@v4

      - name: Export Actions cache endpoints for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # The released package is a hybrid MPI+OpenMP build, so the canary builds
      # and exercises one - a serial build would leave the configuration that
      # actually ships untested. That needs the MS-MPI runtime (mpiexec,
      # msmpi.dll) and its SDK (mpi.h, msmpi.lib).
      #
      # build-all.ps1 would reach for winget; these are fetched straight from
      # Microsoft instead, which does not depend on a package source being
      # reachable from a runner and is the same runtime the package ships in
      # redist\. Ensure-MsMpi then finds MSMPI_INC already set and does nothing.
      - name: Install MS-MPI (runtime + SDK)
        run: |
          $base = 'https://download.microsoft.com/download/7/2/7/72731ebb-b63c-4170-ade7-836966263a8f'
          foreach ($f in 'msmpisetup.exe', 'msmpisdk.msi') {
            Invoke-WebRequest -Uri "$base/$f" -OutFile $f -UseBasicParsing
          }
          # -unattend is MS-MPI's own silent switch; the SDK is a plain MSI.
          Start-Process -Wait -FilePath .\msmpisetup.exe -ArgumentList '-unattend'
          Start-Process -Wait -FilePath msiexec.exe `
            -ArgumentList '/i', 'msmpisdk.msi', '/quiet', '/norestart'

          # Both installers set MSMPI_* machine-wide, but this job's environment
          # was captured before that, so hand them to the later steps by hand.
          foreach ($v in 'MSMPI_INC', 'MSMPI_LIB64', 'MSMPI_BIN') {
            $val = [Environment]::GetEnvironmentVariable($v, 'Machine')
            if ($val) { "$v=$val" | Out-File -Append $env:GITHUB_ENV }
          }
          $bin = [Environment]::GetEnvironmentVariable('MSMPI_BIN', 'Machine')
          if ($bin) { $bin | Out-File -Append $env:GITHUB_PATH }

          # Fail here rather than 40 minutes into a build that cannot find MPI.
          if (-not [Environment]::GetEnvironmentVariable('MSMPI_INC', 'Machine')) {
            throw 'MS-MPI SDK did not register MSMPI_INC; the MPI build would not find MPI.'
          }
          Write-Host "MSMPI_INC=$env:MSMPI_INC"
          if (-not (Test-Path (Join-Path $bin 'mpiexec.exe'))) {
            throw "mpiexec.exe not found under $bin"
          }

      # Disk is the constraint most likely to sink this on a hosted runner: the
      # working trees measured ~35 GB on a developer machine, of which vcpkg is
      # the bulk. Report it up front so a first manual run answers that question
      # even if a later step fails.
      - name: Free disk before
        run: |
          # Cores decide how Norne is run below: the two legs are sized to this
          # number, so record it rather than assume it stays 4.
          Write-Host "logical processors: $env:NUMBER_OF_PROCESSORS"
          # Every fixed drive, not a hardcoded C:. The workspace is on D: on a
          # hosted runner, so measuring C: reports a volume the build never
          # touches - which looks reassuring and says nothing.
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name,
              @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}},
              @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} |
            Format-Table -AutoSize | Out-String | Write-Host
          Write-Host "workspace: $env:GITHUB_WORKSPACE"

      # The canary only. The pinned job leaves the cloning to build-all.ps1.
      - name: Fetch the forks and rebase onto upstream
        id: rebase
        if: matrix.sources == 'latest'
        run: |
          $ErrorActionPreference = 'Continue'
          git config --global user.email 'windows-weekly@users.noreply.github.com'
          git config --global user.name  'windows-weekly'
          # An input is empty on a scheduled run, so default to rebasing.
          $doRebase = '${{ inputs.rebase }}' -ne 'false'
          # Where the harness pins stand, for the summary.
          $pins = $null
          if (Test-Path opm-sources.json) { $pins = (Get-Content -Raw opm-sources.json | ConvertFrom-Json).modules }
          New-Item -ItemType Directory -Force -Path src | Out-Null

          function Get-SourceRevision($dir, $ref) {
            $sha = git -C $dir rev-parse --verify "${ref}^{commit}"
            if ($LASTEXITCODE -ne 0) { throw "could not resolve $ref in $dir" }
            return $sha.Trim()
          }

          $conflicted = @()
          $summary = @()
          $revisions = @()
          foreach ($m in 'opm-common', 'opm-grid', 'opm-simulators') {
            Write-Host "::group::$m"
            git clone --quiet -c core.autocrlf=false `
              --branch $env:FORK_BRANCH "https://github.com/$env:FORK_ORG/$m.git" "src/$m"
            if ($LASTEXITCODE -ne 0) { throw "could not clone $m" }
            git -C "src/$m" remote add upstream "https://github.com/OPM/$m.git"
            git -C "src/$m" fetch --quiet upstream master
            if ($LASTEXITCODE -ne 0) { throw "could not fetch upstream/$m" }

            $forkHead = Get-SourceRevision "src/$m" HEAD
            $pin = $null
            if ($pins -and $pins.$m) { $pin = $pins.$m.commit }
            $pinNote = if (-not $pin) { 'none' } elseif ($pin -eq $forkHead) { 'branch head' } else { "``$($pin.Substring(0, 9))``" }
            $upstreamHead = Get-SourceRevision "src/$m" upstream/master
            $behind = (git -C "src/$m" rev-list --count 'HEAD..upstream/master').Trim()
            $ahead  = (git -C "src/$m" rev-list --count 'upstream/master..HEAD').Trim()
            Write-Host "$m : $ahead patch commit(s), $behind upstream commit(s) not yet in $env:FORK_BRANCH"

            if ($doRebase -and $behind -ne '0') {
              git -C "src/$m" rebase upstream/master
              if ($LASTEXITCODE -ne 0) {
                # Leave nothing half-rebased behind; the report is the output.
                git -C "src/$m" rebase --abort
                $conflicted += $m
                $rebaseResult = 'conflict'
                $summary += "| $m | $ahead | $behind | **conflict** | $pinNote |"
                Write-Host "::warning title=Rebase conflict::$m does not rebase cleanly onto upstream/master"
              } else {
                $rebaseResult = 'rebased'
                $summary += "| $m | $ahead | $behind | rebased | $pinNote |"
              }
            } else {
              $rebaseResult = if ($behind -eq '0') { 'up to date' } else { 'rebase disabled' }
              $summary += "| $m | $ahead | $behind | $rebaseResult | $pinNote |"
            }
            $resolvedHead = Get-SourceRevision "src/$m" HEAD
            $revisions += [ordered]@{
              name = $m
              forkHead = $forkHead
              pinned = $pin
              upstreamHead = $upstreamHead
              resolvedHead = $resolvedHead
              rebaseResult = $rebaseResult
            }
            Write-Host "$m revisions: fork=$forkHead upstream=$upstreamHead resolved=$resolvedHead ($rebaseResult)"
            Write-Host '::endgroup::'
          }

          # Save both the branch that was cloned and the tree selected for the
          # build: a successful rebase changes the commit IDs. Preserve this
          # record even when a later build fails or a rebase conflict stops it.
          [ordered]@{
            harnessHead = Get-SourceRevision . HEAD
            runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            sources = 'latest'
            rebaseRequested = $doRebase
            repositories = $revisions
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 source-revisions.json

          "## Rebase onto upstream master`n"                      | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "| module | patch commits | upstream commits behind | result | harness pin |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "|---|---|---|---|---|"                                 | Out-File -Append $env:GITHUB_STEP_SUMMARY
          $summary | Out-File -Append $env:GITHUB_STEP_SUMMARY

          if ($conflicted.Count -gt 0) {
            $names = $conflicted -join ', '
            "`n**Conflicts in: $names** - these need a human, not a rerun." |
              Out-File -Append $env:GITHUB_STEP_SUMMARY
            Write-Host "::error title=Rebase conflict::$names conflict with upstream/master. Resolve locally; the build was not attempted."
            exit 1
          }

      # build-all.ps1 clones vcpkg and DUNE and applies the DUNE MSVC patches.
      # It skips any OPM module that is already present, so the canary's
      # rebased trees above are kept; in the pinned job nothing is there yet, so
      # it clones the forks and checks out the pins itself, as for a user. Do
      # NOT pass -SkipClone: that also skips Apply-DunePatch, and the DUNE build
      # then fails on Windows.
      - name: Build
        id: build
        run: |
          $target = '${{ inputs.sim_target }}'
          if (-not $target) { $target = 'flow_blackoil' }
          Write-Host "building target: $target (MPI), sources: ${{ matrix.sources }}"
          # -Mpi: DUNE and the OPM modules built against MS-MPI, plus Zoltan
          # from a Trilinos clone, into build-mpi\ / install-mpi\. The pinned
          # job takes everything as opm-sources.json pins it. The canary takes
          # everything at its newest: the OPM branch heads above (-OpmLatest,
          # so build-all.ps1 does not warn that they are not the pins), vcpkg's
          # master and Trilinos' develop - so that a dependency update that
          # breaks the build shows here before anyone moves the pins to it.
          $sources = @{}
          if ('${{ matrix.sources }}' -eq 'latest') {
            $sources = @{ OpmLatest = $true; VcpkgRef = 'master'; TrilinosRef = 'develop' }
          }
          .\build-all.ps1 -Mpi -SimTarget $target -Jobs 4 @sources
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      # Here, not before the build: build-all.ps1 is what cloned the sources.
      # Runs when the build failed too, so the record says what it was given.
      - name: Record the pinned sources
        if: always() && matrix.sources == 'pinned'
        run: |
          $ErrorActionPreference = 'Continue'
          $lock = Get-Content -Raw opm-sources.json | ConvertFrom-Json
          $summary = @()
          $revisions = @()
          $off = @()
          foreach ($m in 'opm-common', 'opm-grid', 'opm-simulators') {
            $pin  = $lock.modules.$m.commit
            $base = $lock.modules.$m.upstream
            $head = $null
            if (Test-Path "src/$m/.git") { $head = "$(git -C "src/$m" rev-parse HEAD)".Trim() }
            $built = if (-not $head) { 'not cloned' } elseif ($head -eq $pin) { 'the pin' } else { "**``$($head.Substring(0, 9))``**" }
            if ($head -and $head -ne $pin) { $off += $m }
            $summary += "| $m | ``$($pin.Substring(0, 9))`` | ``$($base.Substring(0, 9))`` | $built |"
            $revisions += [ordered]@{
              name = $m
              pinned = $pin
              upstreamBase = $base
              resolvedHead = $head
            }
          }
          [ordered]@{
            harnessHead = "$(git rev-parse HEAD)".Trim()
            runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            sources = 'pinned'
            snapshot = $lock.snapshot
            repositories = $revisions
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 source-revisions.json

          "## The pinned OPM sources (opm-sources.json, snapshot $($lock.snapshot))`n" |
            Out-File -Append $env:GITHUB_STEP_SUMMARY
          "| module | pinned commit | on OPM master | built |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "|---|---|---|---|"                                  | Out-File -Append $env:GITHUB_STEP_SUMMARY
          $summary | Out-File -Append $env:GITHUB_STEP_SUMMARY
          if ($off.Count -gt 0) {
            Write-Host "::error title=Not the pins::build-all.ps1 built $($off -join ', ') at commits other than opm-sources.json pins"
            exit 1
          }

      # Both jobs: which vcpkg and Trilinos the build used. The pinned job must
      # have used the pins; the canary's are whatever was newest, recorded so
      # that a break can be traced to a dependency update.
      - name: Record the dependencies
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'
          $pinned = '${{ matrix.sources }}' -eq 'pinned'
          $lock = Get-Content -Raw opm-sources.json | ConvertFrom-Json
          $rows = @()
          $record = [ordered]@{}
          $off = @()
          foreach ($d in @(@('vcpkg', 'vcpkg', $lock.vcpkg), @('trilinos', 'deps/Trilinos', $lock.trilinos))) {
            $key, $dir, $pin = $d
            $pinSha = if ($pin) { $pin.commit } else { $null }
            $head = $null
            $date = $null
            if (Test-Path "$dir/.git") {
              $head = "$(git -C $dir rev-parse HEAD)".Trim()
              $date = "$(git -C $dir log -1 --format=%cs)".Trim()
            }
            $built = if (-not $head) { 'not cloned' } elseif ($head -eq $pinSha) { 'the pin' } else { "``$($head.Substring(0, 9))`` of $date" }
            if ($pinned -and $head -and $head -ne $pinSha) { $off += $key }
            $pinCell = if ($pinSha) { "``$($pinSha.Substring(0, 9))`` of $($pin.date)" } else { 'none' }
            $rows += "| $key | $pinCell | $built |"
            $record[$key] = [ordered]@{ pinned = $pinSha; used = $head; date = $date }
          }
          "`n## Dependencies`n"       | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "| | pinned | built from |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "|---|---|---|"              | Out-File -Append $env:GITHUB_STEP_SUMMARY
          $rows | Out-File -Append $env:GITHUB_STEP_SUMMARY

          # Into the revision record the steps above wrote.
          if (Test-Path source-revisions.json) {
            $rev = Get-Content -Raw source-revisions.json | ConvertFrom-Json
            $rev | Add-Member -NotePropertyName dependencies -NotePropertyValue $record -Force
            $rev | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 source-revisions.json
          }
          if ($off.Count -gt 0) {
            Write-Host "::error title=Not the pins::the pinned job built $($off -join ', ') from commits other than opm-sources.json pins"
            exit 1
          }

      # Norne rather than SPE1: a real field case with faults, multi-segment
      # wells and a decade of schedule exercises far more of the simulator than
      # a ten-cell tutorial, and on 4 ranks it also covers the parallel path -
      # partitioning, the linear solver across ranks, and the rank-0 output
      # gather - which is what the package ships and what SPE1 never touched.
      - name: Fetch the Norne deck
        run: |
          # opm-tests is ~4.4 GB; the deck and its INCLUDE tree are a few MB of
          # it and the rest of norne\ is reference solutions this does not read.
          # Hence blobless + a non-cone sparse set, not a clone.
          git clone --filter=blob:none --no-checkout --depth 1 `
            https://github.com/OPM/opm-tests.git opm-tests
          if ($LASTEXITCODE -ne 0) { throw 'could not clone opm-tests' }
          git -C opm-tests sparse-checkout init --no-cone
          git -C opm-tests sparse-checkout set '/norne/NORNE_ATW2013.DATA' '/norne/INCLUDE/**'
          git -C opm-tests checkout
          if (-not (Test-Path 'opm-tests\norne\NORNE_ATW2013.DATA')) {
            throw 'Norne deck was not checked out'
          }
          $inc = @(Get-ChildItem 'opm-tests\norne\INCLUDE' -Recurse -File).Count
          Write-Host "deck plus $inc INCLUDE files"

      - name: Run Norne on 4 MS-MPI ranks x 1 OpenMP thread
        run: |
          $target = '${{ inputs.sim_target }}'
          if (-not $target) { $target = 'flow_blackoil' }
          $exe = ".\build-mpi\opm-simulators\bin\$target.exe"
          if (-not (Test-Path $exe)) { throw "no simulator at $exe" }

          # Pre-authorize the exe in the firewall. Unattended there is nobody to
          # answer a popup, and a cancelled one leaves a Block rule that makes
          # mpiexec hang rather than fail - a 5.5 h timeout instead of an error.
          .\allow-firewall.ps1

          # setup-env.ps1 imports MSMPI_* from the machine registry and puts
          # mpiexec on PATH for this shell.
          . .\setup-env.ps1

          # 4 ranks, one thread each. The runner has 4 vCPUs, so this fills it
          # exactly and puts the pressure on the widest domain decomposition;
          # the Intel MPI leg below runs 2x2 instead, so between them both the
          # MPI and the OpenMP half of the hybrid build are exercised without
          # either run oversubscribing the machine.
          $deck = '.\opm-tests\norne\NORNE_ATW2013.DATA'
          mpiexec -n 4 $exe $deck --output-dir=norne_out --threads-per-process=1
          if ($LASTEXITCODE -ne 0) { throw "Norne run failed ($LASTEXITCODE)" }

          # A run that exits 0 having written nothing would still be a failure,
          # so check the output exists - and check for what flow actually
          # writes: the summary payload is .ESMRY or .UNSMRY depending on the
          # deck, and .SMSPEC accompanies either form.
          $spec = Test-Path 'norne_out\NORNE_ATW2013.SMSPEC'
          $data = (Test-Path 'norne_out\NORNE_ATW2013.ESMRY') -or
                  (Test-Path 'norne_out\NORNE_ATW2013.UNSMRY')
          if (-not ($spec -and $data)) {
              Write-Host 'output directory contained:'
              Get-ChildItem norne_out | Select-Object -ExpandProperty Name | Write-Host
              throw 'Norne wrote no summary output'
          }
          # The PRT reports the rank count it actually ran on: a parallel build
          # launched wrongly would run 4 independent serial copies over each
          # other's output and still look like a pass here.
          $prt = Get-Content 'norne_out\NORNE_ATW2013.PRT' -Raw -ErrorAction SilentlyContinue
          $ranks = if ($prt -match 'Number of MPI processes:\s*(\d+)') { $matches[1] } else { '?' }
          if ($ranks -ne '4') {
              throw "expected 4 MPI processes, the run reported: $ranks"
          }
          "`n## Smoke test`nNorne ran to completion on $ranks MS-MPI ranks and wrote its summary output." |
            Out-File -Append $env:GITHUB_STEP_SUMMARY

      # The Intel MPI tree is the second thing released - the package for a
      # locked-down machine, where MS-MPI cannot be installed without an
      # administrator - so it is worth the same nightly question. It reuses the
      # sources (pinned or rebased) and the Trilinos clone from above and
      # rebuilds the chain against Intel MPI into build-impi\, which roughly
      # doubles the build time; disk is not the constraint, the workspace is on
      # a volume with ~147 GB free.
      - name: Disk before the Intel MPI build
        run: |
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name,
              @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}},
              @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} |
            Format-Table -AutoSize | Out-String | Write-Host

      - name: Install the Intel MPI runtime (pip, no administrator)
        run: |
          # This is exactly how the released impi package tells a user to get
          # the runtime, so CI installs it the same way rather than a way no
          # user would take: it lands in %APPDATA%\Python\Library.
          python -m pip install --user impi-rt impi-devel
          if ($LASTEXITCODE -ne 0) { throw 'pip install of the Intel MPI runtime failed' }
          $impi = Join-Path $env:APPDATA 'Python\Library'
          foreach ($f in 'lib\impi.lib', 'bin\impi.dll', 'bin\mpiexec.exe') {
            if (-not (Test-Path (Join-Path $impi $f))) { throw "Intel MPI is missing $f" }
          }
          Write-Host "Intel MPI runtime at $impi"

      - name: Build against Intel MPI
        run: |
          $target = '${{ inputs.sim_target }}'
          if (-not $target) { $target = 'flow_blackoil' }
          # Sources and the Trilinos clone are already there from the MS-MPI
          # build; this rebuilds Zoltan, DUNE and OPM against Intel MPI.
          .\build-intelmpi.ps1 -SimTarget $target -Jobs 4
          if ($LASTEXITCODE -ne 0) { throw 'Intel MPI build failed' }

      - name: Run Norne on 2 Intel MPI ranks x 2 OpenMP threads
        run: |
          $target = '${{ inputs.sim_target }}'
          if (-not $target) { $target = 'flow_blackoil' }
          $exe = ".\build-impi\opm-simulators\bin\$target.exe"
          if (-not (Test-Path $exe)) { throw "no Intel MPI simulator at $exe" }

          # Idempotent, and build-impi\ did not exist when it ran for the
          # MS-MPI binary, so this exe needs its own rule.
          .\allow-firewall.ps1

          # What bin\flow-impi.cmd does in the released package: pip puts the
          # runtime somewhere not on PATH, so put it there for this step.
          $impi = Join-Path $env:APPDATA 'Python\Library'
          $env:Path = "$impi\bin;$env:Path"

          # 2 ranks x 2 threads, where the MS-MPI leg ran 4 x 1. Same four
          # threads on the runner's four vCPUs, but this one drives the OpenMP
          # side of the hybrid build, which --threads-per-process=1 never
          # touches - a break in the threaded assembly would otherwise ship.
          $deck = '.\opm-tests\norne\NORNE_ATW2013.DATA'
          & "$impi\bin\mpiexec.exe" -n 2 $exe $deck `
            --output-dir=norne_impi_out --threads-per-process=2
          if ($LASTEXITCODE -ne 0) { throw "Norne under Intel MPI failed ($LASTEXITCODE)" }

          $spec = Test-Path 'norne_impi_out\NORNE_ATW2013.SMSPEC'
          $data = (Test-Path 'norne_impi_out\NORNE_ATW2013.ESMRY') -or
                  (Test-Path 'norne_impi_out\NORNE_ATW2013.UNSMRY')
          if (-not ($spec -and $data)) {
              Write-Host 'output directory contained:'
              Get-ChildItem norne_impi_out | Select-Object -ExpandProperty Name | Write-Host
              throw 'Norne under Intel MPI wrote no summary output'
          }
          # Same trap as the MS-MPI run: serial copies over one output directory
          # would pass a file-exists check. The thread count is checked too -
          # this leg exists to exercise the threaded path, and a build that
          # quietly ran single-threaded would otherwise look like it had.
          $prt = Get-Content 'norne_impi_out\NORNE_ATW2013.PRT' -Raw -ErrorAction SilentlyContinue
          $ranks   = if ($prt -match 'Number of MPI processes:\s*(\d+)')   { $matches[1] } else { '?' }
          $threads = if ($prt -match 'Threads per MPI process:\s*(\d+)')   { $matches[1] } else { '?' }
          if ($ranks -ne '2' -or $threads -ne '2') {
              throw "expected 2 Intel MPI ranks x 2 threads, the run reported: $ranks x $threads"
          }
          "Norne also ran to completion on $ranks Intel MPI ranks x $threads OpenMP threads." |
            Out-File -Append $env:GITHUB_STEP_SUMMARY

      # A canary that built the branch heads as they are has verified a set
      # anyone can fetch, so pin it: build-all.ps1 builds it from then on. That
      # is a run started after a rebase was pushed, before upstream moved, or
      # with rebase off. When the heads were rebased here first, what was built
      # is on no branch and nothing is pinned. Only from master, where the pins
      # live. The build and both runs passed by now, so a failure here is a
      # warning rather than a failed job: a broken series is not the news.
      - name: Pin the branch heads it built
        if: success() && matrix.sources == 'latest' && github.ref == 'refs/heads/master'
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $rev = Get-Content -Raw source-revisions.json | ConvertFrom-Json
          $rebased = @($rev.repositories | Where-Object { $_.resolvedHead -ne $_.forkHead } |
                       ForEach-Object { $_.name })
          if ($rebased.Count -gt 0) {
            "`n## Pins`nNot moved: $($rebased -join ', ') rebased here before the build, so what was built is not on the branches." |
              Out-File -Append $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          # opm-upscaling is not built here; the script keeps its pin as it is.
          $modules = @($rev.repositories | ForEach-Object { $_.name })
          try {
            .\update-opm-pins.ps1 -Modules $modules
          } catch {
            Write-Host "::warning title=Not pinned::$($_.Exception.Message)"
            exit 1
          }
          git add opm-sources.json README.md
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            "`n## Pins`nopm-sources.json already pins the heads this built." | Out-File -Append $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          $snapshot = (Get-Content -Raw opm-sources.json | ConvertFrom-Json).snapshot
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          git commit --quiet -m "Pin OPM master of $snapshot, as the canary built it" `
            -m "The windows branch heads of $($modules -join ', '), built against MS-MPI and Intel MPI and run on Norne: $runUrl"
          # Master may have moved during the build.
          git pull --quiet --rebase origin master
          if ($LASTEXITCODE -ne 0) {
            git rebase --abort
            Write-Host "::warning title=Not pinned::the pin commit does not rebase onto origin/master"
            exit 1
          }
          git push --quiet origin HEAD:master
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning title=Not pinned::could not push the pin commit"
            exit 1
          }
          "`n## Pins`nPinned the heads this built as the snapshot of $snapshot ($(git rev-parse --short HEAD))." |
            Out-File -Append $env:GITHUB_STEP_SUMMARY

      - name: Free disk after
        if: always()
        run: |
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name,
              @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}},
              @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} |
            Format-Table -AutoSize | Out-String | Write-Host

      - name: Upload source revisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opm-source-revisions-${{ matrix.sources }}
          retention-days: 14
          path: source-revisions.json
          if-no-files-found: warn

      - name: Upload the binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flow-windows-x64-${{ matrix.sources }}
          retention-days: 14
          path: |
            source-revisions.json
            build-mpi/opm-simulators/bin/*.exe
            build-mpi/opm-simulators/bin/*.dll
            build-impi/opm-simulators/bin/*.exe
            build-impi/opm-simulators/bin/*.dll

      # Say so somewhere that survives a missed e-mail. One issue is kept open
      # and commented on rather than a fresh one filed every night: the point
      # is to notice a break, and a pile of identical issues is how a canary
      # stops being read. It closes itself when a run passes again, so an open
      # issue means "still broken" without anyone having to tend it. Each job
      # keeps its own report, under its own label: they mean different things.
      - name: Report a failure as an issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const pinned = '${{ matrix.sources }}' === 'pinned';
            const label = pinned ? 'windows-pinned' : 'windows-weekly';
            const title = pinned
              ? 'windows-weekly: the pinned OPM sources stopped building'
              : 'windows-weekly: the Windows patch series stopped building';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                        `/actions/runs/${context.runId}`;
            const what = pinned ? [
              `The nightly build of the pinned OPM sources failed: [run ${context.runId}](${url}).`,
              '',
              'This is the build a user gets from build-all.ps1: OPM, vcpkg and',
              'Trilinos at the commits opm-sources.json pins. Unless the pins just',
              'changed, look at what did: the runner image and its MSVC, the Intel',
              'MPI wheels, a download a pinned vcpkg port can no longer get. The',
              'step summary on that run says what failed.'
            ] : [
              `The nightly canary failed: [run ${context.runId}](${url}).`,
              '',
              'The step summary on that run says which module conflicted or what',
              'the build said. A **conflict** needs the patch series rebased by',
              'hand; a **build failure** usually names the upstream commit - or',
              'it came from vcpkg master or Trilinos develop, which this job takes',
              'at their newest (the summary lists what it used).'
            ];
            const body = [
              ...what,
              '',
              `_Triggered by \`${context.eventName}\` on \`${context.sha.slice(0, 9)}\`._`
            ].join('\n');
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'b60205' });
            }
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: label, per_page: 10
            });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open.data[0].number, body
              });
              core.notice(`Commented on the open report, issue #${open.data[0].number}`);
            } else {
              const made = await github.rest.issues.create({
                ...context.repo, title, body, labels: [label]
              });
              core.notice(`Opened issue #${made.data.number}`);
            }

      - name: Close the failure report once it builds again
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = '${{ matrix.sources }}' === 'pinned' ? 'windows-pinned' : 'windows-weekly';
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: label, per_page: 10
            });
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                        `/actions/runs/${context.runId}`;
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: `Building again as of [run ${context.runId}](${url}) - closing.`
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: issue.number, state: 'closed'
              });
              core.notice(`Closed issue #${issue.number}`);
            }
